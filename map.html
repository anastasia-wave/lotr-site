            <div class="controls">

                <button type="button" id="resetView">Сбросить вид</button>

    </div>

    <script>
        const regionData = {
            eriador: {
                title: "Эриадор",
                description: "Эриадор — большая область на северо-западе Средиземья. В её пределах находятся Шир, Бри, Ривенделл и древние земли Арнора.",
                places: ["Шир", "Бри", "Ривенделл", "Земли Арнора"]
            },
            shire: {
                title: "Шир",
                description: "Шир — родина хоббитов и одно из самых мирных мест Средиземья. Именно отсюда начинается путь Бильбо в «Хоббите» и путешествие Фродо во «Властелине колец».",
                places: ["Хоббитон", "Бэг-Энд", "Мичел Делвинг", "Байуотер"]
            },
            rivendell: {
                title: "Ривенделл",
                description: "Ривенделл — эльфийская обитель Элронда, важное место отдыха, совета и принятия решений.",
                places: ["Дом Элронда", "Долина Ривенделла", "Бруинен", "Высокий перевал"]
            },
            mirkwood: {
                title: "Лихолесье",
                description: "Лихолесье — огромный и мрачный лес на востоке карты.",
                places: ["Дворец Трандуила", "Лесная река", "Дол Гулдур", "Тёмные тропы леса"]
            },
            erebor: {
                title: "Эребор и окрестности",
                description: "Эребор, или Одинокая гора, является главным пунктом назначения в трилогии «Хоббит».",
                places: ["Одинокая гора", "Дейл", "Эсгарот", "Железные холмы"]
            },
            rohan: {
                title: "Рохан",
                description: "Рохан — страна всадников и одно из главных королевств людей.",
                places: ["Эдорас", "Хельмова Падь", "Вестфолд", "Равнины Рохана"]
            },
            gondor: {
                title: "Гондор",
                description: "Гондор — одно из самых могущественных человеческих королевств Средиземья.",
                places: ["Минас Тирит", "Осгилиат", "Дол Амрот", "Пеленнорские поля"]
            },
            mordor: {
                title: "Мордор",
                description: "Мордор — земля Саурона, окружённая горами и насыщенная символами тьмы.",
                places: ["Барад-дур", "Ородруин", "Минас Моргул", "Чёрные врата", "Нурн"]
            },
            fangorn: {
                title: "Фангорн",
                description: "Фангорн — древний лес энтов, связанный с Древобородом и событиями вокруг Изенгарда.",
                places: ["Лес Фангорн", "Область энтов", "Пути к Изенгарду", "Места стоянки Древоборода"]
            },
            rhovanion: {
                title: "Рованион",
                description: "Рованион — крупная область на северо-востоке Средиземья, расположенная восточнее Мглистых гор. В неё входят Лихолесье, земли людей Севера, Дейл, Эсгарот и окрестности Одинокой горы.",
                places: [
                    "Лихолесье",
                    "Эребор",
                    "Дейл",
                    "Эсгарот",
                    "Земли людей Севера"
                ]
            },
            enedwaith: {
                title: "Энедвайт",
                description: "Энедвайт — малонаселённая область между Эриадором и Роханом. Эти земли долгое время оставались дикими и мало контролировались королевствами людей.",
                places: [
                    "Старые тракты",
                    "Холмы Энедвайта",
                    "Пограничные земли",
                    "Южные дороги"
                ]
            }
        };

        const infoPanel = document.getElementById("infoPanel");
        const regions = document.querySelectorAll(".region, .svg-region");

        regions.forEach(region => {
            region.addEventListener("click", () => {
                regions.forEach(r => r.classList.remove("active"));
                region.classList.add("active");

                const key = region.dataset.region;
                const data = regionData[key];

                if (!data) return;

                infoPanel.innerHTML = `
                    <h2>${data.title}</h2>
                    <p>${data.description}</p>
                    <p><strong>Основные объекты:</strong></p>
                    <ul>
                        ${data.places.map(place => `<li>${place}</li>`).join("")}
                    </ul>
                `;
            });
        });

        const mapWrapper = document.getElementById("mapWrapper");
        const mapStage = document.getElementById("mapStage");

        let startScale = window.innerWidth <= 700 ? 0.25 : 0.6;
        let scale = startScale;
        let minScale = window.innerWidth <= 700 ? 0.22 : 0.45;
        let maxScale = 2.2;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        function updateTransform() {
            mapStage.style.transform = `
                translate(-50%, -50%)
                translate(${translateX}px, ${translateY}px)
                scale(${scale})
            `;
        }

        function zoomAt(clientX, clientY, delta) {
            const rect = mapWrapper.getBoundingClientRect();
            const mouseX = clientX - rect.left - mapWrapper.clientWidth / 2;
            const mouseY = clientY - rect.top - mapWrapper.clientHeight / 2;
            const prevScale = scale;

            scale += delta;

            if (scale < minScale) scale = minScale;
            if (scale > maxScale) scale = maxScale;

            const scaleRatio = scale / prevScale;

            translateX = mouseX - (mouseX - translateX) * scaleRatio;
            translateY = mouseY - (mouseY - translateY) * scaleRatio;

            updateTransform();
        }

        mapWrapper.addEventListener("wheel", (event) => {
            event.preventDefault();
            const delta = event.deltaY < 0 ? 0.08 : -0.08;
            zoomAt(event.clientX, event.clientY, delta);
        }, { passive: false });

        mapWrapper.addEventListener("mousedown", (event) => {
            isDragging = true;
            startX = event.clientX - translateX;
            startY = event.clientY - translateY;
        });

        window.addEventListener("mousemove", (event) => {
            if (!isDragging) return;
            translateX = event.clientX - startX;
            translateY = event.clientY - startY;
            updateTransform();
        });

        window.addEventListener("mouseup", () => {
            isDragging = false;
        });

        mapWrapper.addEventListener("touchstart", (event) => {
            if (event.touches.length !== 1) return;

            isDragging = true;

            startX = event.touches[0].clientX - translateX;
            startY = event.touches[0].clientY - translateY;
        }, { passive: false });

        mapWrapper.addEventListener("touchmove", (event) => {
            if (!isDragging || event.touches.length !== 1) return;

            event.preventDefault();

            translateX = event.touches[0].clientX - startX;
            translateY = event.touches[0].clientY - startY;

            updateTransform();
        }, { passive: false });

        mapWrapper.addEventListener("touchend", () => {
            isDragging = false;
        });

        document.getElementById("zoomIn").addEventListener("click", () => {
            const rect = mapWrapper.getBoundingClientRect();
            zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 0.12);
        });

        document.getElementById("zoomOut").addEventListener("click", () => {
            const rect = mapWrapper.getBoundingClientRect();
            zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, -0.12);
        });

        document.getElementById("resetView").addEventListener("click", () => {
            scale = startScale;
            translateX = 0;
            translateY = 0;
            updateTransform();
        });

        updateTransform();
    </script>

    <script src="js/script.js"></script>
